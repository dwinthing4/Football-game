"use strict";
/* ================= UTIL ================= */
const R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=R();return (u-3)*1.414;};

function calcOvr(p){const w=OVR_W[p.pos];let s=0,t=0;for(const k in w){s+=p.a[k]*w[k];t+=w[k];}return Math.round(clamp(s/t,25,99));}

function ensureBody(p){if(!p.ht){const b=BODY[p.pos]||[72,76,200,240];const u=R();p.ht=Math.round(b[0]+u*(b[1]-b[0]));p.wt=Math.round(b[2]+(u*0.6+R()*0.4)*(b[3]-b[2]));}if(p.a.jmp==null)p.a.jmp=Math.round(clamp(rnd(45,75),10,99));return p;}
function fmtHt(i){return Math.floor(i/12)+"'"+(i%12)+'"';}
function genPlayer(pos,q,age){
  const prof=POS_PROFILE[pos];const a={};
  for(const k of ATTRS){a[k]=prof[k]!==undefined?Math.round(clamp(q+prof[k]+gauss()*5,15,99)):Math.round(clamp(rnd(22,48),10,99));}
  if(pos==='K'||pos==='P'){a.spd=ri(45,65);a.tak=ri(15,30);}
  const nm=rname();
  const p={id:nid(),fn:nm.fn,ln:nm.ln,pos,age:age||ri(22,33),a,ovr:0,pot:0,sal:1,yrs:1,tid:null,num:0,traits:[],
    col:pick(COLLEGES)+' '+pick(['University','State','A&M','Tech','College']),st:{},car:{},hist:[],inj:0,lk:genLook(pos)};
  ensureBody(p);p.ovr=calcOvr(p);
  const young=Math.max(0,27-p.age);p.pot=clamp(Math.round(p.ovr+young*rnd(0.5,2.8)),p.ovr,99);
  assignTraits(p);return p;
}
function assignTraits(p){p.traits=[];for(const k in TRAITS){const t=TRAITS[k];if(t.pos.includes(p.pos)&&t.req(p.a)&&R()<.75&&p.traits.length<2)p.traits.push(k);}}
function salaryFor(ovr,pos,age){let s=0.9+Math.pow(Math.max(0,ovr-60),2.2)*0.01*POS_PAY[pos];if(age>31)s*=0.8;return Math.round(s*10)/10;}
function setContract(p){p.sal=salaryFor(p.ovr,p.pos,p.age);p.yrs=p.age>31?ri(1,2):ri(1,5);}

function assignNumbers(t,L){const used=new Set();for(const id of t.roster){const p=L.P[id];if(p.num&&!used.has(p.num)){used.add(p.num);continue;}const r=JERSEY[p.pos];let n,tries=0;do{n=ri(r[0],r[1]);tries++;}while(used.has(n)&&tries<40);if(used.has(n)){n=1;while(used.has(n))n++;}p.num=n;used.add(n);}}

function genTeam(L,i,def){
  const t={id:i,abbr:def.abbr,city:def.city,name:def.name,conf:def.conf,div:def.div,c1:def.c1,c2:def.c2,
    roster:[],depth:{},offStyle:pick(Object.keys(OFF_STYLES)),defStyle:pick(Object.keys(DEF_STYLES)),
    traits:shuffle(Object.keys(TEAM_TRAITS)).slice(0,ri(1,2)),coach:genCoach(),
    owner:{fn:pick(FN),ln:pick(LN),patience:ri(3,9)},ownerSup:60,fanSup:ri(45,75),
    w:0,l:0,tie:0,pf:0,pa:0,dw:0,cw:0,dead:0,picks:[],q:def.q??ri(66,80),hist:[],streak:0};
  for(const pos of POS_LIST){for(let k=0;k<POS_COUNTS[pos];k++){
    const dp=k===0?6:k===1?-1:k===2?-7:-11;
    const q=clamp(t.q+dp+gauss()*5,40,96);
    const p=genPlayer(pos,q);setContract(p);p.tid=t.id;L.P[p.id]=p;t.roster.push(p.id);}}
  // scale payroll toward cap
  const pay=sum(t.roster.map(id=>L.P[id].sal));const target=CAP*rnd(.84,.96);const f=target/pay;
  for(const id of t.roster){const p=L.P[id];p.sal=Math.max(0.9,Math.round(p.sal*f*10)/10);}
  fixDepth(t,L,true);assignNumbers(t,L);
  return t;
}

function fixDepth(t,L,sortAll){
  for(const pos of POS_LIST){
    let cur=(t.depth[pos]||[]).filter(id=>t.roster.includes(id)&&L.P[id].pos===pos);
    const rest=t.roster.filter(id=>L.P[id].pos===pos&&!cur.includes(id));
    cur=cur.concat(rest.sort((a,b)=>L.P[b].ovr-L.P[a].ovr));
    if(sortAll)cur.sort((a,b)=>L.P[b].ovr-L.P[a].ovr);
    t.depth[pos]=cur;
  }
}

function depthPick(t,L,pos,idx,used){
  const list=t.depth[pos]||[];let c=list.filter(id=>!used.has(id)&&!(L.P[id].inj>0));
  if(idx<c.length)return c[idx];
  for(const fp of FALLBACK[pos]||[]){const fl=(t.depth[fp]||[]).filter(id=>!used.has(id)&&!(L.P[id].inj>0));if(fl.length)return fl[fl.length-1];}
  const any=t.roster.filter(id=>!used.has(id));return any[0];
}

const SCHEMES={zone:'Inside zone',outside:'Outside zone',power:'Power',counter:'Counter',dive:'Drive / iso',draw:'Draw'};
const BLOCK_TYPES={pass:'Pass set',drive:'Drive',zone:'Zone step',reach:'Reach',down:'Down block',pull:'Pull',climb:'Climb to LB'};
const GAPS={A:1.1,B:3.3,C:5.6,D:8.2};
const OL_ORDER=['LT','LG','C','RG','RT'];
// returns {slot:{t,d}} ; d = lateral direction (+1 toward higher y / right)
function resolveBlocks(play,side){
  const out={};const sc=play.scheme||(play.type==='run'?(play.dir==='outside'?'outside':'zone'):'pass');
  const ps=side; // playside sign
  for(let i=0;i<5;i++){const sl=OL_ORDER[i];const pos=i-2; // -2..2 ; playside if sign(pos)==ps
    const play_side=pos*ps>0,back=pos*ps<0;let t='pass',d=0;
    if(play.type!=='run'){t='pass';}
    else if(sc==='zone'){t='zone';d=ps;}
    else if(sc==='outside'){t='reach';d=ps;}
    else if(sc==='dive'){t='drive';d=0;if(Math.abs(pos)===1&&back){t='climb';}}
    else if(sc==='draw'){t='draw';d=0;}
    else if(sc==='power'){if(play_side||pos===0){t='down';d=-ps;}else if(Math.abs(pos)===1){t='pull';d=ps;}else{t='drive';d=0;}}
    else if(sc==='counter'){if(play_side||pos===0){t='down';d=-ps;}else{t='pull';d=ps;}}
    out[sl]={t,d};}
  if(play.blocks)for(const k in play.blocks){const b=play.blocks[k];if(!b)continue;out[k]={t:b.t,d:b.d==='P'?side:b.d==='B'?-side:(b.d||0)};}
  return out;
}

function UT(){return L.teams[L.user];}
function news(s){L.news.unshift({y:L.year,w:L.week,s});if(L.news.length>80)L.news.pop();}
function makeSchedule(){
  L.sched=[];const n=L.teams.length;const met={};
  for(let w=0;w<17;w++){
    let best=null;
    for(let tries=0;tries<60;tries++){
      const ids=shuffle([...Array(n).keys()]);const games=[];let bad=0;const used=new Set();
      for(const a of ids){if(used.has(a))continue;
        let b=ids.find(x=>x!==a&&!used.has(x)&&!met[a+'-'+x]&&L.teams[x].div===L.teams[a].div&&L.teams[x].conf===L.teams[a].conf&&w<6);
        if(b===undefined)b=ids.find(x=>x!==a&&!used.has(x)&&!met[a+'-'+x]);
        if(b===undefined){b=ids.find(x=>x!==a&&!used.has(x));bad++;}
        if(b===undefined)break;
        used.add(a);used.add(b);games.push(R()<.5?{h:a,a:b}:{h:b,a:a});}
      if(games.length===n/2&&(!best||bad<best.bad))best={games,bad};
      if(best&&best.bad===0)break;
    }
    for(const g of best.games){met[g.h+'-'+g.a]=met[g.a+'-'+g.h]=1;g.done=false;}
    L.sched.push(best.games);
  }
}
function userGame(week){const wk=L.sched[week];if(!wk)return null;return wk.find(g=>g.h===L.user||g.a===L.user)||null;}

/* ---------- team strength ---------- */
function starters(t,formKey,side){
  const F=side==='O'?OFF_FORMS[formKey]:DEF_FORMS[formKey];const used=new Set();const out=[];
  const slots=side==='O'?F.slots.concat(OL_SLOTS):F.slots;
  for(const s of slots){const id=depthPick(t,L,s[1],s[2],used);used.add(id);out.push({slot:s[0],pos:s[1],id,dx:s[3],dy:s[4]});}
  return out;
}
function teamPower(t){
  const top=(pos,n)=>{const ids=(t.depth[pos]||[]).filter(id=>!L.P[id].inj).slice(0,n);const v=ids.map(id=>L.P[id].ovr);while(v.length<n)v.push(45);return v;};
  const qb=top('QB',1)[0];const off=(qb*3+sum(top('WR',3))+sum(top('TE',1))+sum(top('RB',1))+sum(top('OT',2))+sum(top('OG',2))+sum(top('C',1)))/14;
  const def=(sum(top('DE',2))+sum(top('DT',2))+sum(top('LB',3))*0.9+sum(top('CB',3))+sum(top('S',2)))/11.7;
  const c=t.coach;return {off:off+(c.off-5)*0.6,def:def+(c.def-5)*0.6,ovr:Math.round((off*0.55+def*0.45))};
}
function teamOvr(t){return teamPower(t).ovr;}

/* ---------- quick sim ---------- */
function blankStats(){return {gp:0,pa:0,pc:0,py:0,ptd:0,pint:0,ra:0,ry:0,rtd:0,rec:0,recy:0,rectd:0,tgt:0,tk:0,sk:0,int:0,pd:0,ff:0,fgm:0,fga:0,xpm:0,xpa:0,pnt:0,pnty:0,fum:0};}
function addStat(pid,k,v){const p=L.P[pid];if(!p)return;if(!p.st||!('gp' in p.st))p.st=blankStats();p.st[k]=(p.st[k]||0)+v;}
function poisson(l){let k=0,p=1,e=Math.exp(-l);do{k++;p*=R();}while(p>e);return k-1;}
function simGame(g){
  const H=L.teams[g.h],A=L.teams[g.a];const ph=teamPower(H),pa=teamPower(A);
  const box={h:{},a:{}};
  const side=(T,O,D,home)=>{
    const edge=(O.off-D.def)+(home?1.5:0)+(T.id===L.user?DIFFS[L.diff].user*0.3:0);
    const drives=ri(10,12);let pts=0,tds=0,fgs=0;
    for(let i=0;i<drives;i++){const r=R();const pTD=clamp(0.22+edge*0.012,0.06,0.45),pFG=clamp(0.16+edge*0.004,0.08,0.24);
      if(r<pTD){tds++;pts+=R()<0.94?7:6;}else if(r<pTD+pFG){fgs++;pts+=3;}}
    const style=OFF_STYLES[T.offStyle];
    const passY=Math.max(60,Math.round(rnd(170,290)*(style.pass/0.55)*0.85+edge*5+gauss()*30));
    const rushY=Math.max(20,Math.round(rnd(80,150)*((1-style.pass)/0.45)+edge*3+gauss()*20));
    const ptd=Math.round(tds*style.pass*1.05);const rtd=Math.max(0,tds-ptd);
    return {pts,tds,fgs,passY,rushY,ptd,rtd,int:poisson(clamp(0.85-edge*0.03,0.2,2)),sacks:poisson(clamp(2.3-edge*0.05,0.6,5))};
  };
  const hs=side(H,ph,pa,true),as=side(A,pa,ph,false);
  if(hs.pts===as.pts){if(R()<0.85){(R()<0.55?hs:as).pts+=3;}}
  for(const [T,s,D,o] of [[H,hs,A,as],[A,as,H,hs]])distStats(T,s,D,o);
  g.hs=hs.pts;g.as=as.pts;g.done=true;
  finishGame(g);
  return g;
}
function distStats(T,s,D,o){
  const d=(pos,i)=>(T.depth[pos]||[])[i];const dd=(pos,i)=>(D.depth[pos]||[])[i];
  const all=[...T.roster];for(const id of all)addStat(id,'gp',1);
  const qb=d('QB',0);const att=Math.round(s.passY/7.1+rnd(-3,3));addStat(qb,'pa',att);addStat(qb,'pc',Math.round(att*rnd(.58,.7)));addStat(qb,'py',s.passY);addStat(qb,'ptd',s.ptd);addStat(qb,'pint',s.int);creditInts(D,s.int);
  const rcv=[[d('WR',0),.32],[d('WR',1),.24],[d('TE',0),.16],[d('WR',2),.13],[d('RB',0),.11],[d('TE',1),.04]];
  let left=s.ptd;
  for(const [id,f] of rcv){if(!id)continue;const y=Math.round(s.passY*f*rnd(.7,1.3));addStat(id,'recy',y);addStat(id,'rec',Math.max(0,Math.round(y/11.5)));addStat(id,'tgt',Math.round(y/8));if(left>0&&R()<f*2.2){addStat(id,'rectd',1);left--;}}
  if(left>0)addStat(d('WR',0),'rectd',left);
  const rush=[[d('RB',0),.72],[d('RB',1),.18],[qb,.1]];let rl=s.rtd;
  for(const [id,f] of rush){if(!id)continue;const y=Math.round(s.rushY*f);addStat(id,'ry',y);addStat(id,'ra',Math.max(1,Math.round(y/4.3)));if(rl>0&&R()<f*1.3){addStat(id,'rtd',1);rl--;}}
  if(rl>0)addStat(d('RB',0),'rtd',rl);
  const k=d('K',0);addStat(k,'fgm',s.fgs);addStat(k,'fga',s.fgs+(R()<.3?1:0));addStat(k,'xpm',s.tds);addStat(k,'xpa',s.tds);
  const p=d('P',0);const np=ri(2,6);addStat(p,'pnt',np);addStat(p,'pnty',np*ri(42,50));
  // defense of D against T's offense
  const tkl=[['LB',0,7],['LB',1,5],['S',0,5],['S',1,4],['CB',0,4],['CB',1,4],['LB',2,3],['DE',0,3],['DE',1,3],['DT',0,2],['DT',1,2],['CB',2,2]];
  for(const [pos,i,n] of tkl){const id=dd(pos,i);if(id)addStat(id,'tk',Math.max(0,Math.round(n*rnd(.5,1.5))));}
  for(let i=0;i<s.sacks;i++){const id=dd(pick(['DE','DE','DE','DT','LB']),ri(0,1));if(id)addStat(id,'sk',1);}
}
function creditInts(D,n){for(let i=0;i<n;i++){const id=(D.depth[pick(['CB','CB','S','S','LB'])]||[])[ri(0,1)];if(id){addStat(id,'int',1);addStat(id,'pd',1);}}}
function finishGame(g){
  const H=L.teams[g.h],A=L.teams[g.a];
  H.pf+=g.hs;H.pa+=g.as;A.pf+=g.as;A.pa+=g.hs;
  const po=L.phase==='playoffs';
  if(g.hs>g.as){win(H,A,po);}else if(g.as>g.hs){win(A,H,po);}else if(!po){H.tie++;A.tie++;H.coach.t++;A.coach.t++;}
  L.results.push({y:L.year,w:L.week,po,h:g.h,a:g.a,hs:g.hs,as:g.as});
  for(const T of [H,A]){if(T.id===L.user)userAfterGame(T,g);}
  // injuries
  for(const T of [H,A]){if(R()<0.35){const id=pick(T.roster);const p=L.P[id];if(p&&!p.inj){p.inj=ri(1,4);if(T.id===L.user)news(`${p.pos} ${p.fn} ${p.ln} injured (${p.inj} wk).`);}}}
}
function win(W,Lo,po){
  if(!po){W.w++;Lo.l++;}W.coach[po?'pw':'w']++;Lo.coach[po?'pl':'l']++;
  W.streak=W.streak>0?W.streak+1:1;Lo.streak=Lo.streak<0?Lo.streak-1:-1;
  const sameDiv=W.conf===Lo.conf&&W.div===Lo.div;if(!po&&sameDiv)W.dw++;if(!po&&W.conf===Lo.conf)W.cw++;
}
function userAfterGame(T,g){
  const won=(g.h===T.id&&g.hs>g.as)||(g.a===T.id&&g.as>g.hs);const tie=g.hs===g.as;
  const c=T.coach;const po=L.phase==='playoffs';
  if(won){T.fanSup=clamp(T.fanSup+(po?5:2.5),0,100);T.ownerSup=clamp(T.ownerSup+(po?5:2),0,100);c.pts+=po?3:2;c.xp+=po?60:40;}
  else if(!tie){T.fanSup=clamp(T.fanSup-2,0,100);T.ownerSup=clamp(T.ownerSup-(2.5*(10-T.owner.patience)/5),0,100);c.pts+=1;c.xp+=15;}
  else {c.pts+=1;}
}
function simWeek(){

}
function advanceWeek(){

/* ---------- standings & playoffs ---------- */
function pct(t){const g=t.w+t.l+t.tie;return g?(t.w+t.tie*0.5)/g:0;}
function sortTeams(arr){return arr.slice().sort((a,b)=>pct(b)-pct(a)||b.dw-a.dw||b.cw-a.cw||(b.pf-b.pa)-(a.pf-a.pa));}
function seeds(conf){
  const ts=L.teams.filter(t=>t.conf===conf);const divs=['East','North','South','West'];
  const winners=sortTeams(divs.map(d=>sortTeams(ts.filter(t=>t.div===d))[0]));
  const wc=sortTeams(ts.filter(t=>!winners.includes(t))).slice(0,3);
  return winners.concat(wc).map(t=>t.id);
}
function startPlayoffs(){
  L.phase='playoffs';
  L.playoff={round:0,A:seeds('A'),N:seeds('N'),alive:{},games:[],elim:{}};
  for(const c of ['A','N'])for(const id of L.playoff[c])L.playoff.alive[id]=1;
  const us=UT();if(L.playoff.alive[us.id])news(`Playoffs! Your team is the #${(L.playoff[us.conf].indexOf(us.id))+1} seed.`);else news('Your season is over. You missed the playoffs.');
  makePlayoffRound();
}
const ROUND_NAMES=['Wild Card','Divisional','Conference Final','Championship'];
function makePlayoffRound(){
  const P=L.playoff;P.games=[];
  if(P.round<3){
    for(const c of ['A','N']){
      const alive=P[c].filter(id=>P.alive[id]);
      let list=alive;if(P.round===0){list=alive.slice(1);} // top seed bye
      const n=list.length;for(let i=0;i<n/2;i++){P.games.push({h:list[i],a:list[n-1-i],done:false});}
    }
  } else {
    const a=P.A.find(id=>P.alive[id]),n=P.N.find(id=>P.alive[id]);
    P.games.push(R()<.5?{h:a,a:n,done:false,neutral:1}:{h:n,a:a,done:false,neutral:1});
  }
}
function userPlayoffGame(){if(L.phase!=='playoffs')return null;return L.playoff.games.find(g=>!g.done&&(g.h===L.user||g.a===L.user))||null;}
function resolvePlayoffGame(g){
  if(g.hs===g.as){if(R()<.5)g.hs+=3;else g.as+=3;}
  const loser=g.hs>g.as?g.a:g.h;L.playoff.alive[loser]=0;L.playoff.elim[loser]=L.playoff.round;
}
function simPlayoffRound(){
  const P=L.playoff;
  for(const g of P.games){if(!g.done){simGame(g);resolvePlayoffGame(g);}}
  advancePlayoffs();
}
function advancePlayoffs(){
  const P=L.playoff;
  if(P.games.some(g=>!g.done))return;
  if(P.round===3){
    const g=P.games[0];const champ=g.hs>g.as?g.h:g.a;const T=L.teams[champ];
    L.champs.push({y:L.year,t:champ,name:teamName(T)});T.coach.titles++;
    news(`${teamName(T)} win the ${L.year} championship!`);
    if(champ===L.user){T.fanSup=100;T.ownerSup=clamp(T.ownerSup+25,0,100);T.coach.pts+=10;}
    L.phase='offseason';L.off='resign';beginOffseason();return;
  }
  P.round++;makePlayoffRound();
  if(!P.alive[L.user]&&P.games.length){/* user out */}
}

/* ---------- offseason ---------- */
function beginOffseason(){
  // season review, owner evaluation
  const us=UT();
  for(const t of L.teams){
    t.hist.push({y:L.year,w:t.w,l:t.l,t:t.tie,pf:t.pf,pa:t.pa,po:L.playoff&&L.playoff.elim[t.id]!==undefined?ROUND_NAMES[L.playoff.elim[t.id]]:(L.champs.length&&L.champs[L.champs.length-1].y===L.year&&L.champs[L.champs.length-1].t===t.id?'Champion':'-')});

/* ---------- AI per tick ---------- */
function lagPred(r,tau){const a=lagPos(r,tau),b=lagPos(r,tau+0.1);const vx=(a[0]-b[0])/0.1,vy=(a[1]-b[1])/0.1;return [a[0]+vx*tau,a[1]+vy*tau];}

function offenseAI(){
  const S=GM.pl;
  for(const e of GM.O){
    if(e.eng)continue;
    if(e===S.carrier&&!(e.role==='qb'&&!S.scramble)){carrierMove(e);continue;}
    if(S.carrier&&S.carrier.unit==='D'){pursue(e,S.carrier);continue;}
    if(e.role==='qb'){qbLogic(e);continue;}
    if(e.role==='runner'&&!S.handed){runnerPre(e);continue;}
    if(e.role==='route'&&!(S.carrier&&S.carrier!==S.qb)&&!S.scramble){routeRun(e);continue;}
    if(e.role==='route'&&S.scramble&&S.carrier===S.qb&&S.kind==='pass'){routeRun(e);continue;}

}
function routeRun(e){
  const S=GM.pl;
  if(S.ballState==='air'&&e===S.target){steer(e,S.ball.tx,S.ball.ty,1);return;}
  if(e.jam>0){steer(e,e.x+0.3,e.y,0.25);return;}
  if(e.route&&e.ri<e.route.length){const [tx,ty]=e.route[e.ri];steer(e,tx,ty,1);if(Math.hypot(tx-e.x,ty-e.y)<0.9)e.ri++;return;}
  const settle=['hitch','curl','comeback','screen'].includes(e.rname);
  if(settle){steer(e,e.x,e.y,0);return;}
  const sp=Math.hypot(e.vx,e.vy)||1;let tx=e.x+e.vx/sp*5,ty=clamp(e.y+e.vy/sp*5,1.2,FW-1.2);steer(e,tx,ty,0.85);

function qbLogic(e){
  const S=GM.pl,op=S.op;

    if(!S.handed){steer(e,e.x-0.3,e.y,0.3);}else steer(e,e.x-0.5,e.y+(S.holeY>CY?-1:1),0.4);return;

  const drop=e.sx<S.los-3?S.los-7:S.los-7.5;

    if(GM.wantScramble){GM.wantScramble=false;S.scramble=true;S.kind='scramble';flash('QB scramble');return;}
    const I=GM.input;if(Math.hypot(I.x,I.y)>0.2)steerDir(e,I.x,I.y,0.9);

function pressureOn(qb){let m=99;for(const d of GM.D){if(d.eng||d.stun>0)continue;m=Math.min(m,dist(d,qb));}return m;}
function aiQB(e){

function ballSpeed(qb){return 17+eff(qb,'thp')*0.13+(hasT(qb,'gunslinger')?2:0);}

function runnerPre(e){

function blockLogic(e){

function carrierMove(e){

  const nearFoe=()=>{let b=null,bd=99;for(const o of (e.unit==='O'?GM.D:GM.O)){if(o.stun>0)continue;const d=dist(o,e);if(d<bd&&(o.x-e.x)*dir>-1){bd=d;b=o;}}return [b,bd];};

function doJuke(e,f){

function defenseAI(){

      const I=GM.input;if(Math.hypot(I.x,I.y)>0.2){steerDir(e,I.x,I.y,1);continue;}}
    if(c&&c.unit==='D'){escort(e,c);continue;}
    if(runLive){
      if(S.thrown||S.scramble){if(e.react>0){e.react-=DTS;coverLogic(e);continue;}pursue(e,c);continue;}
      if(e.runReact>0){e.runReact-=DTS;coverLogic(e);continue;}

    if(S.ballState==='air'){ballReact(e);continue;}
    if(S.op.pa&&S.t<0.7&&(e.p.pos==='LB'||e.p.pos==='S')&&e.role!=='rush'){steer(e,e.x-1,e.y,0.5);continue;}

function coverLogic(e){
  const S=GM.pl;

    case 'man':manCover(e);break;

function covTau(d,r,zone){

/* ---------- engagement / contact ---------- */
function engagements(){
  const S=GM.pl;
  // initiate
  for(const b of GM.O){if(b.eng||b.stun>0||b.role==='qb'||b===S.carrier||(b.role!=='block'&&!(S.carrier&&S.carrier!==S.qb&&b!==S.carrier&&S.carrier.unit==='O')))continue;
    if(S.carrier&&S.carrier.unit==='D')continue;

    for(const d of GM.D){if(d.eng||d.stun>0||d.free>0||d===S.carrier)continue;if(lead&&S.carrier&&dist(d,S.carrier)<3.5)continue;if(dist(b,d)<1.15){b.eng=d;d.eng=b;b.engT=d.engT=0;break;}}}
  for(const b of GM.O){const d=b.eng;if(!d)continue;
    if(d.eng!==b){b.eng=null;continue;}
    b.engT+=DTS;d.engT+=DTS;
    const passRush=S.kind==='pass'&&!S.thrown&&!S.scramble&&d.role==='rush';
    let rv,bv;
    if(passRush){
      const bull=d.rushMove==='bull';

      bv=eff(b,'pbk')*0.75+eff(b,'str')*(bull?0.35:0.25);

      if(hasT(b,'wall'))bv+=7;if(teamHasTrait(b.team,'protect'))bv+=4;

    } else {

      if(hasT(b,'mauler'))bv+=7;if(teamHasTrait(d.team,'runstuff'))rv+=4;if(!b.ol&&b.p.pos!=='TE'&&b.p.pos!=='FB')bv-=8;
    }

  }
}
function integrate(){
  for(const e of GM.ents){if(e.eng)continue;e.x+=e.vx*DTS;e.y+=e.vy*DTS;}
  // separation
  const es=GM.ents;for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){const a=es[i],b=es[j];if(a.eng===b)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<0.75&&d>0.001){const o=(0.75-d)/2;const ux=dx/d,uy=dy/d;

function tackles(){

      if(hasT(c,'juke'))pj+=0.15;if(hasT(f,'surehands_t'))pj-=0.15;if(teamHasTrait(f.team,'suretackle'))pj-=0.07;if(teamHasTrait(c.team,'yac'))pj+=0.05;

function floatText(e,s){if(GM.headless)return;GM.float.push({x:e.x,y:e.y,s,t:1});}
function tackleMade(f,c,fumble){

function resolveCatch(){

  let R1=null,rd=99;for(const o of GM.O){if(o===qb||o.ol)continue;const d=Math.hypot(o.x-B.tx,o.y-B.ty);const cr=1.35+(clamp(eff(o,'cth'),30,105)-50)/120;if(d<cr&&d<rd){rd=d;R1=o;}}

  if(D1&&(!R1||dd<=rd+0.6)){

    if(hasT(D1,'ballhawk'))pInt+=0.12;if(teamHasTrait(D1.team,'ballhawks'))pInt+=0.06;if(hasT(qb,'gunslinger'))pInt+=0.03;

function drawPlayArt(cn,p,names,sel,live){
  const c=cn.getContext('2d'),W=cn.width,H=cn.height;c.imageSmoothingEnabled=false;c.clearRect(0,0,W,H);
  for(let i=0;i<8;i++){c.fillStyle=i%2?'#2c8239':'#329443';c.fillRect(0,i*H/8,W,H/8+1);}
  const sc=W/54,losY=Math.round(H*(p.side==='O'?0.66:0.4));
  const X=y=>Math.round(y*sc),Y=dx=>Math.round(losY-dx*sc);
  c.fillStyle='rgba(255,255,255,.55)';c.fillRect(0,losY,W,2);
  const ds=Math.max(4,Math.round(sc*2.2));
  const dot=(dx,y,col,lab)=>{c.fillStyle='#000';c.fillRect(X(y)-ds/2-1,Y(dx)-ds/2-1,ds+2,ds+2);c.fillStyle=col;c.fillRect(X(y)-ds/2,Y(dx)-ds/2,ds,ds);if(lab){c.font=`600 ${Math.max(10,Math.round(W/34))}px ${FD}`;c.textAlign='center';c.textBaseline='top';c.fillStyle='#fff';c.fillText(lab.slice(0,8),X(y),Y(dx)+ds/2+1);}};
  if(p.side==='O'){
    const F=OFF_FORMS[p.form];const side=p.rside==='L'?-1:1;const bl=resolveBlocks(p,side);const gy=CY+side*(GAPS[p.gap||(p.dir==='outside'?'D':'B')]||3.3);
    for(const s of OL_SLOTS){const a=bl[s[0]]||{t:'pass',d:0};const x0=s[3],y0=CY+s[4];let ex=x0+2.2,ey=y0;
      if(a.t==='zone'){ex=x0+1.8;ey=y0+a.d*1.8;}else if(a.t==='reach'){ex=x0+1;ey=y0+a.d*2.4;}else if(a.t==='down'){ex=x0+1.8;ey=y0+a.d*2.2;}else if(a.t==='climb'){ex=x0+4.5;}else if(a.t==='pass'){ex=x0-2;}else if(a.t==='draw'){ex=x0-1.2;}
      const cp=p.paths&&p.paths[s[0]];c.strokeStyle=a.t==='pull'?'#ff9b4a':a.t==='pass'?'#9fd0ff':'#ffffff';c.lineWidth=Math.max(2,W/110);c.beginPath();c.moveTo(X(y0),Y(x0));
      if(cp&&cp.length){for(const [f,l] of cp)c.lineTo(X(y0+l),Y(x0+f));}else if(a.t==='pull'){c.lineTo(X(gy-side*1.5),Y(x0-1.6));c.lineTo(X(gy),Y(x0+2.5));}else c.lineTo(X(ey),Y(ex));c.stroke();
      dot(x0,y0,'#c9d2dc');}
    for(const s of F.slots){const x0=s[3],y0=CY+s[4];const r=p.routes[s[0]];
      const cp=p.paths&&p.paths[s[0]];
      if(cp&&cp.length){c.strokeStyle=p.type==='run'&&p.carrier===s[0]?'#ff5a5a':'#ffe066';c.lineWidth=Math.max(2,W/90);c.beginPath();c.moveTo(X(y0),Y(x0));for(const [f,l] of cp)c.lineTo(X(y0+l),Y(x0+f));c.stroke();}
      else if(r&&ROUTES[r]&&r!=='block'&&!(p.type==='run'&&p.carrier===s[0])){const inward=y0<CY?1:-1;c.strokeStyle='#ffe066';c.lineWidth=Math.max(2,W/90);c.beginPath();c.moveTo(X(y0),Y(x0));for(const [f,i] of ROUTES[r]){c.lineTo(X(clamp(y0+i*inward,0.5,53)),Y(x0+f));}c.stroke();}
      else if(p.type==='run'&&p.carrier===s[0]){c.strokeStyle='#ff5a5a';c.lineWidth=Math.max(2,W/80);c.beginPath();c.moveTo(X(y0),Y(x0));c.lineTo(X(gy),Y(0));c.lineTo(X(gy),Y(6));c.stroke();}
      dot(x0,y0,s[0]==='QB'?'#ffb627':'#ffffff',names?names[s[0]]:'');}
    if(sel){const all=F.slots.concat(OL_SLOTS);const sp=all.find(z=>z[0]===sel);if(sp){c.strokeStyle='#ffd23f';c.lineWidth=3;c.beginPath();c.arc(X(CY+sp[4]),Y(sp[3]),ds*1.3,0,7);c.stroke();}}
    if(live&&live.length>1){c.strokeStyle='#ffd23f';c.lineWidth=Math.max(3,W/80);c.setLineDash([6,4]);c.beginPath();c.moveTo(X(live[0][1]),Y(live[0][0]));for(const q of live)c.lineTo(X(q[1]),Y(q[0]));c.stroke();c.setLineDash([]);}
  } else {
    const F=DEF_FORMS[p.form];
    const Z={c2t:[[16,13],[16,40],[5,6],[5,47],[13,CY],[8,18],[8,35]],c2m:[[16,13],[16,40]],c2:[[16,13],[16,40],[5,6],[5,47],[8,20],[8,33]],c3:[[16,9],[17,CY],[16,44],[5,7],[5,46],[8,19],[8,34]],c4:[[14,7],[15,20],[15,33],[14,46],[6,13],[6,40]]}[p.cov];
    if(Z){for(const z of Z){c.strokeStyle=z[0]>=13?'rgba(120,200,255,.9)':'rgba(255,224,102,.85)';c.lineWidth=2;c.beginPath();c.ellipse(X(z[1]),Y(-z[0]*0.8),sc*4.5,sc*2.6,0,0,7);c.stroke();}}
    else{c.font=`600 ${Math.round(W/12)}px ${FD}`;c.textAlign='left';c.textBaseline='bottom';c.fillStyle='#fff';c.fillText(p.cov==='c0'?'MAN, NO HELP':'MAN + DEEP SAFETY',4,H-2);}
    for(const s of F.slots){const blz=p.blitz.includes(s[0])||s[1]==='DE'||s[1]==='DT';
      if(blz&&s[1]!=='DE'&&s[1]!=='DT'){c.strokeStyle='#ff5a5a';c.lineWidth=2;c.beginPath();c.moveTo(X(CY+s[4]),Y(-s[3]*0.8));c.lineTo(X(CY+s[4]*0.3),Y(2));c.stroke();}

  }
}

function statLine(s,pos){const parts=[];if(s.pa)parts.push(`${s.pc}/${s.pa}, ${s.py} yds, ${s.ptd} TD, ${s.pint} INT`);if(s.ra)parts.push(`${s.ra} car, ${s.ry} yds${s.rtd?', '+s.rtd+' TD':''}`);if(s.rec)parts.push(`${s.rec} rec, ${s.recy} yds${s.rectd?', '+s.rectd+' TD':''}`);if(s.tk||s.sk||s.int)parts.push(`${s.tk} tkl${s.sk?', '+s.sk+' sack':''}${s.int?', '+s.int+' INT':''}`);if(s.fga)parts.push(`${s.fgm}/${s.fga} FG`);return parts.join(' · ');}

const GA={
  form(f){callForm=f;refreshGameUI();},
  ctl(k){GM.ctlSlot=k;L.ctlSlot=k;refreshGameUI();},
  call(id){const p=L.plays.find(x=>x.id===id);if(!p)return;
    if(p.side==='O'){const dp=aiDefCall(oppOf(L.user),p);setupPlay(p,dp);}else{const op=aiOffCall(GM.poss);setupPlay(op,p);}
    GM.phase='pre';preWait=0;refreshGameUI();},
  autoCall(){if(GM.poss===L.user){if(GM.down===4&&GM.twoPt==null){const d=aiFourth();if(d==='fg'){GA.fg();return;}if(d==='punt'){GA.punt();return;}}const op=aiOffCall(L.user);GA.call(op.id);}else{const dp=aiDefCall(L.user,null);GA.call(dp.id);}},
  punt(){punt();afterAnyPlay();},fg(){kickFG();afterAnyPlay();},
  pat(k){doPAT(GM.patTeam,k);afterAnyPlay();},
  timeout(){if(GM.to[L.user]>0&&GM.lastRunoff>0){GM.to[L.user]--;GM.clock+=GM.lastRunoff;GM.lastRunoff=0;flash('Timeout');refreshGameUI();}},
  simDrive(){simDrive();aiPreCall();GM.huddle=null;refreshGameUI();},
  simGame(){simRestOfGame();refreshGameUI();},
  speed(){GM.speed=GM.speed===1?2:GM.speed===2?4:1;refreshGameUI();},
  skip(){const S=GM.pl;if(!S||S.done)return;if(S.ballState==='pre')snap();GM.headless=true;let g=0;while(!S.done&&g++<1200)stepPlay();GM.headless=false;if(!S.done)endPlay({type:'tackle',x:S.carrier?S.carrier.x:S.los});postWait=1.0;},
  finish(){finishUserGame();}
};

function finishUserGame(){
  const g=GM.g;
  for(const pid in GM.st){const s=GM.st[pid];for(const k in s){if(s[k])addStat(+pid,k,s[k]);}}
  for(const T of [GM.H,GM.A])for(const id of T.roster)addStat(id,'gp',1);
  g.hs=GM.score[GM.H.id];g.as=GM.score[GM.A.id];g.done=true;g.played=true;
  finishGame(g);
  const res=`${GM.A.abbr} ${g.as} – ${GM.H.abbr} ${g.hs}`;
  if(L.phase==='playoffs'){resolvePlayoffGame(g);for(const x of L.playoff.games){if(!x.done){simGame(x);resolvePlayoffGame(x);}}advancePlayoffs();}
  else{for(const x of L.sched[L.week]){if(!x.done)simGame(x);}advanceWeek();}
  news(`Final: ${res}`);
  GM=null;document.getElementById('game').classList.remove('on');document.getElementById('gpanel').style.display='none';
  saveGame();render();
}

function matchupHTML(away,home){const side=t=>`<div class="side">${logoC(t,72)}<b>${esc(t.city)}</b><b style="color:var(--gold)">${esc(t.name)}</b><span class="small">${t.w}-${t.l}${t.tie?'-'+t.tie:''} · ${ovrTag(teamOvr(t))}</span></div>`;

let EDSEL=null;
function edOpt(cur,opts){return opts.map(([v,n])=>`<option value="${v}" ${cur===v?'selected':''}>${n}</option>`).join('');}
function drawEditor(){
  const p=EDP;p.paths=p.paths||{};let body='';

    ${p.type==='run'?`<div class="grid g2" style="gap:6px"><label>Ball carrier <select onchange="EDP.carrier=this.value;drawEditor()">${F.slots.filter(s=>['RB','FB','QB'].includes(s[0])).map(s=>`<option ${p.carrier===s[0]?'selected':''}>${s[0]}</option>`).join('')}</select></label>
    <label>Line scheme <select onchange="EDP.scheme=this.value;drawEditor()">${edOpt(p.scheme||'zone',Object.entries(SCHEMES))}</select></label>
    <label>Target gap <select onchange="EDP.gap=this.value;drawEditor()">${edOpt(p.gap||'B',[['A','A gap (center–guard)'],['B','B gap (guard–tackle)'],['C','C gap (off tackle)'],['D','D gap (edge)']])}</select></label>
    <label>Side <select onchange="EDP.rside=this.value;drawEditor()">${edOpt(p.rside||'auto',[['auto','Either (coach picks)'],['L','Left'],['R','Right']])}</select></label></div>
    <label class="small"><input type="checkbox" ${p.delay?'checked':''} onchange="EDP.delay=this.checked?1:0"> Delayed handoff (draw)</label>`:`<div class="row"><label class="small"><input type="checkbox" ${p.pa?'checked':''} onchange="EDP.pa=this.checked?1:0"> Play action</label><label class="small"><input type="checkbox" ${p.deep?'checked':''} onchange="EDP.deep=this.checked?1:0"> Deep shot</label></div>`}
    <h3 style="margin-top:6px">Offensive line</h3><div class="grid g2" style="gap:6px">${OL_ORDER.map(k=>`<label>${k} <select onchange="setBlock('${k}',this.value)">${edOpt(blk(k),blkOpts)}</select></label>`).join('')}</div>
    <h3 style="margin-top:6px">Skill players</h3><div class="grid g2" style="gap:6px">${F.slots.filter(s=>s[0]!=='QB'&&!(p.type==='run'&&p.carrier===s[0])).map(s=>`<label>${s[0]} <select onchange="EDP.routes['${s[0]}']=this.value;delete EDP.paths['${s[0]}'];drawEditor()">${ROUTE_NAMES.concat(p.paths[s[0]]?['custom']:[]).map(r=>`<option ${(p.routes[s[0]]||'block')===r?'selected':''}>${r}</option>`).join('')}</select></label>`).join('')}</div>`;
  } else {const F=DEF_FORMS[p.form];
    body=`<label>Formation <select onchange="EDP.form=this.value;EDP.blitz=[];drawEditor()">${Object.keys(DEF_FORMS).map(f=>`<option value="${f}" ${f===p.form?'selected':''}>${DEF_FORMS[f].lab}</option>`).join('')}</select></label>
    <label>Coverage <select onchange="EDP.cov=this.value;drawEditor()">${['c0','c1','c2','c3','c4','c2m','c2t'].map(c=>`<option value="${c}" ${p.cov===c?'selected':''}>${covName(c)}</option>`).join('')}</select></label>
    <h3 style="margin-top:8px">Blitzers</h3><div class="row">${F.slots.filter(s=>!['DE','DT'].includes(s[1])).map(s=>`<label class="small"><input type="checkbox" ${p.blitz.includes(s[0])?'checked':''} onchange="EDP.blitz=this.checked?[...EDP.blitz,'${s[0]}']:EDP.blitz.filter(x=>x!=='${s[0]}');drawEditor()"> ${s[0]}</label>`).join('')}</div>`;
  }
  modal(`<h2>Play editor</h2><div class="grid g2"><div class="grid" style="gap:8px;align-content:start"><label>Name <input value="${esc(p.name)}" oninput="EDP.name=this.value"></label>${body}</div>
  <div>${p.side==='O'?`<p class="small" style="margin:0 0 6px"><b>Draw it:</b> press on a player and drag to draw his route, run path or block. Linemen dragged backward and sideways become pullers; dragged sideways they zone or reach that way; dragged far upfield they climb to a linebacker.</p>`:''}
  <canvas id="edcv" width="720" height="470" style="width:100%;border-radius:10px;touch-action:none;cursor:crosshair"></canvas>
  ${p.side==='O'?`<div class="row" style="margin-top:6px"><span class="small mute">${EDSEL?'Selected: '+EDSEL:'Tap a player to select'}</span><span class="sp"></span><button class="sm" onclick="if(EDSEL){delete EDP.paths[EDSEL];if(EDP.blocks)delete EDP.blocks[EDSEL];if(EDP.routes[EDSEL]==='custom')EDP.routes[EDSEL]='block';}drawEditor()">Clear selected</button><button class="sm" onclick="EDP.paths={};EDP.blocks=null;for(const k in EDP.routes)if(EDP.routes[k]==='custom')EDP.routes[k]='block';drawEditor()">Clear drawings</button></div>`:''}</div></div>

function setBlock(k,v){EDP.blocks=EDP.blocks||{};if(v==='auto'){delete EDP.blocks[k];delete EDP.paths[k];}else{const [t,d]=v.split(':');EDP.blocks[k]={t,d:+d};if(t!=='pull')delete EDP.paths[k];}drawEditor();}
function edSpots(p){const F=OFF_FORMS[p.form];return F.slots.concat(OL_SLOTS).map(s=>({slot:s[0],dx:s[3],y:CY+s[4]}));}
function rdp(pts,eps){if(pts.length<3)return pts;let dmax=0,idx=0;const [a,b]=[pts[0],pts[pts.length-1]];for(let i=1;i<pts.length-1;i++){const p=pts[i];const d=Math.abs((b[1]-a[1])*p[0]-(b[0]-a[0])*p[1]+b[0]*a[1]-b[1]*a[0])/(Math.hypot(b[1]-a[1],b[0]-a[0])||1);if(d>dmax){dmax=d;idx=i;}}
  if(dmax>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}return [a,b];}
function wireEditor(cn){
  const p=EDP;const W=cn.width,H=cn.height;const sc=W/54,losY=Math.round(H*0.66);
  const toF=(ev)=>{const r=cn.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width,py=(ev.clientY-r.top)*H/r.height;return [(losY-py)/sc,px/sc];};
  let cur=null,pts=null;
  cn.onpointerdown=ev=>{const [dx,y]=toF(ev);let best=null,bd=2.6;for(const s of edSpots(p)){const d=Math.hypot(s.dx-dx,s.y-y);if(d<bd){bd=d;best=s;}}
    if(!best)return;cn.setPointerCapture(ev.pointerId);cur=best;EDSEL=best.slot;pts=[[best.dx,best.y]];};
  cn.onpointermove=ev=>{if(!cur)return;const [dx,y]=toF(ev);const l=pts[pts.length-1];if(Math.hypot(dx-l[0],y-l[1])>0.7){pts.push([dx,y]);drawPlayArt(cn,p,null,EDSEL,pts);}};
  cn.onpointerup=ev=>{if(!cur)return;const s=cur;cur=null;
    if(pts.length<3){drawEditor();return;}
    let sp=rdp(pts,0.55).slice(1);if(sp.length>7)sp=sp.filter((_,i)=>i%Math.ceil(sp.length/7)===0||i===sp.length-1);
    const rel=sp.map(([dx,y])=>[Math.round((dx-s.dx)*10)/10,Math.round((y-s.y)*10)/10]);
    const isOL=OL_ORDER.includes(s.slot);const last=rel[rel.length-1];
    if(isOL){EDP.blocks=EDP.blocks||{};const f=last[0],l=last[1];let t='drive',d=0;
      if(rel.some(q=>q[0]<-0.6)&&Math.abs(l)>1.8){t='pull';d=Math.sign(l);}
      else if(f>3.5&&Math.abs(l)<2.5){t='climb';}
      else if(f<-0.5&&Math.abs(l)<1.8){t='pass';}
      else if(Math.abs(l)>=1){t=Math.abs(l)>Math.max(1,f)*1.6?'reach':'zone';d=Math.sign(l);}
      EDP.blocks[s.slot]={t,d};if(t==='pull')EDP.paths[s.slot]=rel;else delete EDP.paths[s.slot];}
    else if(s.slot==='QB'){}
    else{EDP.paths[s.slot]=rel;if(!(p.type==='run'&&p.carrier===s.slot))EDP.routes[s.slot]='custom';else{const cross=rel.find(q=>q[0]>=-0.5)||last;EDP.rside=cross[1]+s.y-CY<0?'L':'R';}}
    drawEditor();};
}
function savePlay(){const p=EDP;if(!p.name.trim())p.name='Custom play';if(!p.id){p.id='c'+Date.now().toString(36);L.plays.push(p);}else{const i=L.plays.findIndex(x=>x.id===p.id);L.plays[i]=p;}
  if(p.side==='O'){const F=OFF_FORMS[p.form];for(const s of F.slots)if(s[0]!=='QB'&&!p.routes[s[0]])p.routes[s[0]]='block';}
  EDSEL=null;closeModal();saveGame();render();toast('Play saved');}

/* ---------- trade ---------- */
function vTrade(){
  const T=UT();if(SUB.tradeTeam==null)SUB.tradeTeam=(L.user+1)%32;const O=L.teams[SUB.tradeTeam];
  const asset=(t,a)=>a.type==='p'?(()=>{const p=L.P[a.id];return p?`${p.pos} ${pname(p)} ${p.ovr}`:'?';})():`${a.pk.y} R${a.pk.r} (${L.teams[a.pk.from].abbr})`;
  const give=SUB.tradeGive,get=SUB.tradeGet;
  const gA=give.map(x=>typeof x==='number'?{type:'p',id:x}:{type:'k',pk:x}),rA=get.map(x=>typeof x==='number'?{type:'p',id:x}:{type:'k',pk:x});
  const ev=evalTrade(gA,rA);
  const lst=(t,sel,which)=>`<div class="tbl" style="max-height:360px;overflow:auto"><table>${t.roster.map(id=>L.P[id]).sort((a,b)=>b.ovr-a.ovr).map(p=>`<tr><td><input type="checkbox" ${sel.includes(p.id)?'checked':''} onchange="tradeToggle('${which}',${p.id})"></td><td class="click" onclick="showPlayer(${p.id})">${pname(p)}</td><td>${p.pos}</td><td>${ovrTag(p.ovr)}</td><td>${p.age}</td><td>${money(p.sal)}</td></tr>`).join('')}</table></div>
   <div style="margin-top:6px">${t.picks.filter(pk=>pk.y<=L.year+2).sort((a,b)=>a.y-b.y||a.r-b.r).map(pk=>{const on=sel.some(x=>typeof x==='object'&&x.y===pk.y&&x.r===pk.r&&x.from===pk.from);return `<label class="tag"><input type="checkbox" ${on?'checked':''} onchange='tradePick("${which}",${JSON.stringify(pk)})'> ${pk.y} R${pk.r}${pk.from!==t.id?' '+L.teams[pk.from].abbr:''}</label>`;}).join('')}</div>`;
  const ratio=Math.min(2,ev.ratio);
  return `<div class="row"><h2 style="margin:0">Trade</h2><span class="sp"></span><label>Partner <select onchange="SUB.tradeTeam=+this.value;SUB.tradeGet=[];render()">${L.teams.filter(t=>t.id!==L.user).map(t=>`<option value="${t.id}" ${t.id===O.id?'selected':''}>${esc(teamName(t))}</option>`).join('')}</select></label></div>
  <div class="panel" style="margin:10px 0"><div class="row"><div class="sp"><b>You give:</b> ${gA.map(a=>asset(T,a)).join(', ')||'—'}<br><b>You get:</b> ${rA.map(a=>asset(O,a)).join(', ')||'—'}</div>
  <div style="min-width:180px"><div class="small mute">Their interest</div>${meter(ratio*50,ev.ok?'var(--good)':'var(--flag)')}</div><button class="pri" onclick="proposeTrade()" ${gA.length||rA.length?'':'disabled'}>Propose trade</button><button onclick="SUB.tradeGive=[];SUB.tradeGet=[];render()">Clear</button></div></div>
  <div class="grid g2"><div class="panel"><h3>${esc(teamName(T))}</h3>${lst(T,give,'give')}</div><div class="panel"><h3>${esc(teamName(O))} · cap room ${money(capRoom(O))}</h3>${lst(O,get,'get')}</div></div>`;
}
function tradeToggle(w,id){const a=w==='give'?SUB.tradeGive:SUB.tradeGet;const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);render();}
function tradePick(w,pk){const a=w==='give'?SUB.tradeGive:SUB.tradeGet;const i=a.findIndex(x=>typeof x==='object'&&x.y===pk.y&&x.r===pk.r&&x.from===pk.from);if(i>=0)a.splice(i,1);else a.push(pk);render();}
function proposeTrade(){
  const T=UT(),O=L.teams[SUB.tradeTeam];
  const gA=SUB.tradeGive.map(x=>typeof x==='number'?{type:'p',id:x}:{type:'k',pk:x}),rA=SUB.tradeGet.map(x=>typeof x==='number'?{type:'p',id:x}:{type:'k',pk:x});
  const ev=evalTrade(gA,rA);
  const gp=gA.filter(a=>a.type==='p').map(a=>L.P[a.id]),rp=rA.filter(a=>a.type==='p').map(a=>L.P[a.id]);
  const salIn=sum(rp.map(p=>p.sal)),salOut=sum(gp.map(p=>p.sal));
  if(capRoom(T)+salOut-salIn<0){toast('That trade puts you over the cap.');return;}
  if(capRoom(O)+salIn-salOut<0){toast(`${O.abbr} can't fit that salary under their cap.`);return;}
  if(T.roster.length-gp.length+rp.length>55||O.roster.length-rp.length+gp.length>55){toast('Roster limits block this trade.');return;}
  if(!ev.ok){if(L.rel)L.rel[O.id]=clamp((L.rel[O.id]||50)-1.5,0,100);toast(ev.ratio>0.8?`${O.abbr}: "Close. Add a little more."`:`${O.abbr}: "Not interested."`);return;}
  for(const p of gp){T.roster=T.roster.filter(x=>x!==p.id);O.roster.push(p.id);p.tid=O.id;}
  for(const p of rp){O.roster=O.roster.filter(x=>x!==p.id);T.roster.push(p.id);p.tid=T.id;}
  const mv=(from,to,pk)=>{from.picks=from.picks.filter(x=>!(x.y===pk.y&&x.r===pk.r&&x.from===pk.from));to.picks.push(pk);};
  for(const a of gA)if(a.type==='k')mv(T,O,a.pk);for(const a of rA)if(a.type==='k')mv(O,T,a.pk);
  // also update pending draft order
  if(L.draftOrder)for(const s of L.draftOrder){const own=L.teams.find(t=>t.picks.some(p=>p.y===L.year+1&&p.r===s.r&&p.from===s.from));if(own)s.owner=own.id;}
  fixDepth(T,L);fixDepth(O,L);assignNumbers(T,L);assignNumbers(O,L);
  news(`Trade with ${O.abbr}: sent ${gA.length} asset(s), received ${rA.length}.`);
  if(L.rel)L.rel[O.id]=clamp((L.rel[O.id]||50)+(ev.ratio>1.25?5:2),0,100);
  SUB.tradeGive=[];SUB.tradeGet=[];saveGame();toast('Trade accepted!');render();
}

function signOffer(id){const p=L.P[id],T=UT();const sal=Math.max(0.9,+document.getElementById('fa_sal').value||p.ask);const yrs=+document.getElementById('fa_yrs').value;
  if(T.roster.length>=53&&L.phase!=='offseason'){toast('Your roster is full (53). Release someone first.');return;}

  if(sal<p.ask*(0.92-lean)&&!(sal>=p.ask*(0.85-lean)&&R()<0.4)){toast(`${p.ln} turned it down. Try closer to ${money(p.ask)}.`);return;}
  signFA(T,p,sal,yrs);news(`Signed ${p.pos} ${p.fn} ${p.ln}: ${yrs} yr, ${money(sal)}/yr.`);closeModal();saveGame();render();}

function importCSV(){
  const txt=document.getElementById('csv').value.trim();if(!txt){toast('Paste some CSV rows first.');return;}
  const rows=txt.split(/\r?\n/).map(l=>l.split(',').map(s=>s.trim())).filter(r=>r.length>=6&&r[0].toUpperCase()!=='TEAM');
  const by={};let bad=0;
  for(const r of rows){const t=L.teams.find(x=>x.abbr.toUpperCase()===r[0].toUpperCase());const pos=r[3].toUpperCase();if(!t||!POS_LIST.includes(pos)){bad++;continue;}(by[t.id]=by[t.id]||[]).push(r);}
  let n=0;
  for(const tid in by){const t=L.teams[tid];
    for(const id of t.roster){delete L.P[id];}t.roster=[];
    for(const r of by[tid]){const ovr=clamp(+r[5]||65,30,99);const p=genPlayer(r[3].toUpperCase(),ovr,clamp(+r[4]||25,20,45));p.fn=r[1];p.ln=r[2];scaleToOvr(p,ovr);assignTraits(p);setContract(p);p.tid=t.id;if(r[6])p.num=+r[6];L.P[p.id]=p;t.roster.push(p.id);n++;}
    for(const pos of POS_LIST){let have=t.roster.filter(id=>L.P[id].pos===pos).length;while(have<POS_COUNTS[pos]&&t.roster.length<53){const p=genPlayer(pos,rnd(50,62),ri(22,28));p.sal=0.9;p.yrs=1;p.tid=t.id;L.P[p.id]=p;t.roster.push(p.id);have++;}}
    const pay=sum(t.roster.map(id=>L.P[id].sal));if(pay>CAP*0.97){const f=CAP*0.95/pay;for(const id of t.roster)L.P[id].sal=Math.max(0.9,Math.round(L.P[id].sal*f*10)/10);}
    t.depth={};fixDepth(t,L,true);assignNumbers(t,L);}
  saveGame();toast(`Imported ${n} players for ${Object.keys(by).length} team(s)${bad?`, skipped ${bad} rows`:''}.`);render();
}

/* ================= SAVE / LOAD ================= */
const SKEY='gridiron_dynasty_v1';let CLOUD=null,CLOUD_META=null,cloudTimer=null;
function serialize(){L.uid=UID;L.plays=L.plays.filter(p=>p.id!=='__prev');return JSON.stringify(L);}
function deserialize(s){const d=JSON.parse(s);if(!d||!d.teams||!d.P)throw new Error('bad');L=d;if(!L.ctrl)L.ctrl='smooth';if(L.qlen>300)L.qlen=300;for(const id in L.P)ensureBody(L.P[id]);for(const pl of L.plays){if(pl.side==='O'&&pl.type==='run'&&!pl.scheme&&!pl.custom){const d=defaultPlays().find(x=>x.name===pl.name);if(d)Object.assign(pl,{scheme:d.scheme,gap:d.gap,rside:d.rside});}}UID=L.uid||Object.keys(L.P).reduce((m,k)=>Math.max(m,+k),0)+1;}
function hasLocalSave(){try{return !!localStorage.getItem(SKEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SKEY);}catch(e){}if(CLOUD){CLOUD.db.collection('data/users/'+CLOUD.id).doc('save_meta').set({n:0,ts:Date.now(),cleared:true}).catch(()=>{});CLOUD_META=null;}}
function saveGame(manual){
  if(!L||L.picking)return;const s=serialize();L.savedAt=Date.now();
  try{localStorage.setItem(SKEY,s);localStorage.setItem(SKEY+'_ts',String(L.savedAt));}catch(e){if(manual)toast('Could not save on this device.');}
  if(CLOUD){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(s),manual?0:1500);}
  if(manual)toast('Saved');
}
async function cloudSave(s){
  try{const col=CLOUD.db.collection('data/users/'+CLOUD.id);const N=180000;const n=Math.ceil(s.length/N);
    for(let i=0;i<n;i++)await col.doc('save_'+i).set({d:s.slice(i*N,(i+1)*N)});
    await col.doc('save_meta').set({n,ts:Date.now(),year:L.year,team:L.user});}catch(e){console.warn('cloud save failed',e);}
}
async function cloudLoad(){
  const col=CLOUD.db.collection('data/users/'+CLOUD.id);const m=CLOUD_META;let s='';
  for(let i=0;i<m.n;i++){const d=await col.doc('save_'+i).get();if(!d.exists)throw new Error('missing chunk');s+=d.data().d;}return s;
}
async function loadGame(){
  let localTs=0;try{localTs=+localStorage.getItem(SKEY+'_ts')||0;}catch(e){}
  try{
    if(CLOUD_META&&CLOUD_META.n&&CLOUD_META.ts>localTs+2000){deserialize(await cloudLoad());}
    else{deserialize(localStorage.getItem(SKEY));}
  }catch(e){try{deserialize(localStorage.getItem(SKEY));}catch(e2){toast('No save found.');return;}}
  TAB='home';render();
}
async function cloudInit(){
  try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');const user=await window.claude.use('user');if(!db||!user)return;
    const id=await user.id();if(!id)return;CLOUD={db,id};
    const m=await db.collection('data/users/'+id).doc('save_meta').get();if(m.exists&&m.data().n){CLOUD_META=m.data();if(!L)render();}
  }catch(e){CLOUD=null;}
}

/* ---------- coordinator meeting / game plan ---------- */
let PLAN_SIDE='O',PLAN_SC='1st';
function nextOpp(){const g=L.phase==='playoffs'?userPlayoffGame():userGame(L.week);if(!g)return null;return L.teams[g.h===L.user?g.a:g.h];}
function planSuggest(side,key){const T=UT(),opp=nextOpp()||T;return playsFor(L.user,side).map(p=>({p,s:scorePlay(p,key,opp,T)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p.id);}
function ensurePlan(){if(!L.plan||L.plan.week!==L.week||L.plan.year!==L.year)L.plan={year:L.year,week:L.week,O:{},D:{},draft:true};return L.plan;}
function vPlan(){
  const opp=nextOpp();if(!opp)return `<div class="panel"><h2>Game plan</h2><p>No upcoming game.</p></div>`;
  const P=ensurePlan();const sel=P[PLAN_SIDE][PLAN_SC]||[];const list=playsFor(L.user,PLAN_SIDE);const rec=planSuggest(PLAN_SIDE,PLAN_SC);
  return `<div class="panel"><h2>Coordinator meeting</h2><div class="row">${personC('coach',UT().id,48)}<div class="sp"><b>Week ${L.week+1}: vs ${esc(teamName(opp))}</b><div class="small mute">They run a ${esc(opp.offStyle)} offense and a ${esc(opp.defStyle)} defense. Pick up to 3 plays for each situation; they show first in your play call.</div></div>
   <button class="sm" onclick="autoPlan()">Use coordinator picks</button><button class="pri sm" onclick="L.plan.draft=false;saveGame();toast('Game plan saved');go('home')">Lock in plan</button></div></div>
  <div class="row" style="margin:10px 0"><div class="seg">${[['O','Offense'],['D','Defense']].map(([k,n])=>`<button class="${PLAN_SIDE===k?'on':''}" onclick="PLAN_SIDE='${k}';render()">${n}</button>`).join('')}</div></div>
  <div class="chips2">${SCENS.map(([k,n])=>`<button class="${PLAN_SC===k?'on':''}" onclick="PLAN_SC='${k}';render()">${n}${(P[PLAN_SIDE][k]||[]).length?` · ${(P[PLAN_SIDE][k]||[]).length}`:''}</button>`).join('')}</div>
  <p class="small mute">Coordinator recommendation for ${SCENS.find(s=>s[0]===PLAN_SC)[1]}: ${rec.map(id=>esc((L.plays.find(p=>p.id===id)||{}).name||'')).join(', ')}</p>
  <div class="teamgrid">${list.map(p=>{const on=sel.includes(p.id);return `<div class="panel plan ${on?'on':''}" onclick="togglePlan('${p.id}')" style="padding:8px;cursor:pointer">${rec.includes(p.id)?'<i class="pk">RECOMMENDED</i>':''}<canvas data-play="${p.id}" width="160" height="100" style="width:100%;border-radius:6px"></canvas><b>${esc(p.name)}</b><div class="small mute">${PLAN_SIDE==='O'?OFF_FORMS[p.form].lab:DEF_FORMS[p.form].lab}${on?' · ✓ in plan':''}</div></div>`;}).join('')}</div>`;
}
function togglePlan(id){const P=ensurePlan();const a=P[PLAN_SIDE][PLAN_SC]=P[PLAN_SIDE][PLAN_SC]||[];const i=a.indexOf(id);if(i>=0)a.splice(i,1);else{if(a.length>=3)a.shift();a.push(id);}render();}
function autoPlan(){const P=ensurePlan();for(const side of ['O','D'])for(const [k] of SCENS)P[side][k]=planSuggest(side,k);toast('Coordinators filled in the plan');render();}

function slotMeta(){try{return JSON.parse(localStorage.getItem('gd_slots')||'{}');}catch(e){return {};}}

(function migrate(){try{const old=localStorage.getItem('gridiron_dynasty_v1');const m=slotMeta();if(old&&!localStorage.getItem(slotKey(1))){localStorage.setItem(slotKey(1),old);const d=JSON.parse(old);const t=d.teams[d.user];m[1]={team:teamName(t),c1:t.c1,coach:(t.coach.fn+' '+t.coach.ln),year:d.year,rec:t.w+'-'+t.l,mode:d.mode,ts:Date.now()};writeMeta(m);}}catch(e){}})();

async function cloudSave2(s,slot){try{const col=CLOUD.db.collection('data/users/'+CLOUD.id);const N=180000;const n=Math.ceil(s.length/N);for(let i=0;i<n;i++)await col.doc(`s${slot}_${i}`).set({d:s.slice(i*N,(i+1)*N)});await col.doc(`s${slot}_meta`).set(Object.assign({n,ts:Date.now()},slotMeta()[slot]||{}));}catch(e){console.warn('cloud save failed',e);}}
async function cloudLoad2(slot,meta){const col=CLOUD.db.collection('data/users/'+CLOUD.id);let s='';for(let i=0;i<meta.n;i++){const d=await col.doc(`s${slot}_${i}`).get();if(!d.exists)throw new Error('chunk');s+=d.data().d;}return s;}

    :`<div class="slot empty"><span class="pos">SLOT ${n}</span><b>Empty</b><span class="mute small">Start a new coaching career</span><div class="row"><button class="go" onclick="NEWSLOT=${n};CUR_SLOT=${n};renderTitle()">New career</button></div></div>`).join('')}</div></div>`;
